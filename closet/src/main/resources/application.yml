server:
  port: 8082
spring:
  application:
    name: closet
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    datasource:
      jdbcUrl: jdbc:postgresql://localhost:5432/closet-batch
      username: closet-user
      password: closet_1234
      driver-class-name: org.postgresql.Driver
    job:
      enabled: false

  business:
    datasource:
      jdbcUrl: jdbc:postgresql://localhost:5432/closet
      username: closet-user
      password: closet_1234
      driver-class-name: org.postgresql.Driver

management:
  server:
    port: 9103
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
closet:
  weather:
    api:
      base-url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      service-key: ${KMA_SERVICE_KEY:dummyKey}
      timeout: 10000
      data-type: JSON